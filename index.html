<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Volleyball Tactics Board</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#f3f5f7;color:#17202a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:720px;margin:0 auto;padding-bottom:16px}
.header{background:#fff;padding:11px 12px;border-bottom:1px solid #ddd}
.header h1{font-size:17px;margin:0 0 2px}
.header p{font-size:12px;color:#667085;margin:0}
.controls,.row{display:flex;flex-wrap:wrap;gap:7px;padding:8px 10px;background:#fff;border-bottom:1px solid #e1e5ea;align-items:center}
button{font:inherit;font-size:13px;min-height:42px;padding:7px 10px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;color:#22334b}
button.active{background:#1769aa;color:#fff;border-color:#1769aa}
button:disabled{opacity:.4}
label{font-size:13px}
input[type=color]{width:40px;height:40px;padding:2px;border:1px solid #ccd;border-radius:8px;background:#fff}
.board-wrap{padding:12px 26px 8px;display:flex;justify-content:center}
#court{
  display:block;
  width:min(78vw,330px);
  height:auto;
  aspect-ratio:360/640;
  background:#d8aa72;
  border-radius:11px;
  box-shadow:0 2px 12px rgba(0,0,0,.14);
  touch-action:none;
  -ms-touch-action:none;
  user-select:none;
  -webkit-user-select:none;
}
.status{padding:6px 14px 9px;font-size:12px;color:#526275;text-align:center;min-height:30px}
.hint{font-size:11px;color:#667085;padding:0 14px 8px;text-align:center}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>🏐 Volleyball Tactics Board</h1>
    <p>5–1 system · S / SS / MB1 / MB2 / OH1 / OH2</p>
  </div>

  <div class="controls">
    <button type="button" data-tool="move" class="active">Move</button>
    <button type="button" data-tool="ball">Ball path</button>
    <button type="button" data-tool="player">Player path</button>
    <button type="button" data-tool="erase">Erase</button>
    <button type="button" id="clear">Clear lines</button>
    <button type="button" id="reset">Reset</button>
  </div>

  <div class="row">
    <label><input type="checkbox" id="overlay" checked> Positions 1–6</label>
    <label>Line <input type="color" id="lineColor" value="#fff3a6"></label>
  </div>

  <div class="board-wrap">
    <svg id="court" viewBox="0 0 360 640" xmlns="http://www.w3.org/2000/svg" aria-label="Interactive volleyball tactics board"></svg>
  </div>

  <div class="status" id="status">Ready — drag a player or the ball.</div>
  <div class="hint">Players stay on their own half. The ball starts on Team A's half and can move anywhere on that half.</div>

  <div class="row">
    <button type="button" id="undo">Undo</button>
    <button type="button" id="redo">Redo</button>
    <button type="button" id="rotate">Rotate formation</button>
    <button type="button" id="flip">Swap sides</button>
  </div>
</div>

<script>
(function(){
  var svg=document.getElementById('court');
  var statusEl=document.getElementById('status');
  var overlayEl=document.getElementById('overlay');
  var lineColorEl=document.getElementById('lineColor');
  var NS='http://www.w3.org/2000/svg';

  var roles=['S','SS','MB1','MB2','OH1','OH2'];
  var base=[[90,475],[180,475],[270,475],[90,560],[180,560],[270,560]];
  var state,undoStack=[],redoStack=[],tool='move',drag=null;

  function freshState(){
    var players=[],i;
    for(i=0;i<6;i++) players.push({id:'A'+i,team:'A',role:roles[i],x:base[i][0],y:base[i][1]});
    for(i=0;i<6;i++) players.push({id:'B'+i,team:'B',role:roles[i],x:base[i][0],y:640-base[i][1]});
    return {players:players,ball:{x:295,y:585,side:'A'},lines:[]};
  }
  function clone(o){return JSON.parse(JSON.stringify(o))}
  function snap(){return clone(state)}
  function pushUndo(before){undoStack.push(before);if(undoStack.length>60)undoStack.shift();redoStack=[]}

  function make(tag,attrs,parent){
    var e=document.createElementNS(NS,tag),k;
    for(k in attrs)e.setAttribute(k,attrs[k]);
    (parent||svg).appendChild(e);
    return e;
  }
  function addText(x,y,str,attrs,parent){
    attrs=attrs||{};attrs.x=x;attrs.y=y;attrs['text-anchor']='middle';
    var t=make('text',attrs,parent);t.textContent=str;return t;
  }

  function drawCourt(){
    make('rect',{x:0,y:0,width:360,height:640,fill:'#d8aa72'});
    make('rect',{x:27,y:25,width:306,height:590,fill:'#e8bb85',stroke:'#fff','stroke-width':3});
    make('rect',{x:27,y:25,width:306,height:295,fill:'#d79b61',opacity:.35});
    make('line',{x1:27,y1:320,x2:333,y2:320,stroke:'#fff','stroke-width':6});
    make('line',{x1:27,y1:222,x2:333,y2:222,stroke:'#fff','stroke-width':2});
    make('line',{x1:27,y1:418,x2:333,y2:418,stroke:'#fff','stroke-width':2});
    addText(180,44,'TEAM B',{fill:'#704c2d','font-size':12,'font-weight':700});
    addText(180,603,'TEAM A',{fill:'#704c2d','font-size':12,'font-weight':700});
    if(overlayEl.checked){
      var labels=[[5,78,93],[6,180,93],[1,282,93],[4,78,255],[3,180,255],[2,282,255],
      [4,78,385],[3,180,385],[2,282,385],[5,78,548],[6,180,548],[1,282,548]],i;
      for(i=0;i<labels.length;i++) addText(labels[i][1],labels[i][2],String(labels[i][0]),{fill:'#6f4f34',opacity:.28,'font-size':42,'font-weight':800});
    }
  }

  function drawArrow(line,index){
    var attrs={x1:line.x1,y1:line.y1,x2:line.x2,y2:line.y2,stroke:line.color,'stroke-width':4,'stroke-linecap':'round'};
    if(line.type==='player')attrs['stroke-dasharray']='9 7';
    var p=make('line',attrs);p.setAttribute('data-line',index);

    var ang=Math.atan2(line.y2-line.y1,line.x2-line.x1),len=13,a1=ang+2.55,a2=ang-2.55;
    var pts=line.x2+','+line.y2+' '+(line.x2+Math.cos(a1)*len)+','+(line.y2+Math.sin(a1)*len)+' '+(line.x2+Math.cos(a2)*len)+','+(line.y2+Math.sin(a2)*len);
    var head=make('polygon',{points:pts,fill:line.color});head.setAttribute('data-line',index);
  }

  function drawPlayer(p){
    var g=make('g',{transform:'translate('+p.x+' '+p.y+')'});
    g.setAttribute('data-player',p.id);
    g.setAttribute('id','player-'+p.id);
    // Invisible larger touch target for iPhone accuracy
    var hit=make('circle',{cx:0,cy:0,r:34,fill:'transparent'},g);hit.setAttribute('data-player',p.id);
    var c=make('circle',{cx:0,cy:0,r:22,fill:p.team==='A'?'#2266af':'#c94d4c',stroke:'#fff','stroke-width':2.5},g);c.setAttribute('data-player',p.id);
    var t=addText(0,4,p.role,{fill:'#fff','font-size':p.role.length>2?10:12,'font-weight':800,'pointer-events':'none'},g);t.setAttribute('data-player',p.id);
  }

  function render(){
    while(svg.firstChild)svg.removeChild(svg.firstChild);
    drawCourt();
    for(var i=0;i<state.lines.length;i++)drawArrow(state.lines[i],i);
    for(var j=0;j<state.players.length;j++)drawPlayer(state.players[j]);

    var b=make('g',{transform:'translate('+state.ball.x+' '+state.ball.y+')',id:'ball-group'});
    b.setAttribute('data-ball','1');
    var hit=make('circle',{cx:0,cy:0,r:31,fill:'transparent'},b);hit.setAttribute('data-ball','1');
    var bc=make('circle',{cx:0,cy:0,r:14,fill:'#ffe35c',stroke:'#61461b','stroke-width':2.5},b);bc.setAttribute('data-ball','1');
    make('path',{d:'M -9 -5 Q 0 0 9 5 M -7 9 Q 0 0 7 -9',stroke:'#9c7523','stroke-width':1.5,fill:'none','pointer-events':'none'},b);

    document.getElementById('undo').disabled=!undoStack.length;
    document.getElementById('redo').disabled=!redoStack.length;
  }

  function point(clientX,clientY){
    var r=svg.getBoundingClientRect();
    return {x:(clientX-r.left)*360/r.width,y:(clientY-r.top)*640/r.height};
  }
  function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
  function attrUp(n,name){
    while(n&&n!==svg){
      if(n.getAttribute&&n.hasAttribute(name))return n.getAttribute(name);
      n=n.parentNode;
    }
    return null;
  }
  function playerById(id){
    for(var i=0;i<state.players.length;i++)if(state.players[i].id===id)return state.players[i];
    return null;
  }

  function constrainedYForPlayer(p,y){
    // leave space around net and baseline so marker remains fully visible
    return p.team==='A' ? clamp(y,345,590) : clamp(y,50,295);
  }
  function constrainedYForBall(y){
    return state.ball.side==='A' ? clamp(y,338,600) : clamp(y,40,302);
  }

  function begin(cx,cy,target){
    var p=point(cx,cy),playerId=attrUp(target,'data-player'),isBall=attrUp(target,'data-ball')!==null,lineId=attrUp(target,'data-line');
    if(tool==='erase'){
      if(lineId!==null){var before=snap();state.lines.splice(parseInt(lineId,10),1);pushUndo(before);render()}
      return;
    }
    drag={start:p,last:p,before:snap(),playerId:playerId,isBall:isBall,moved:false,element:null};
    if(playerId)drag.element=document.getElementById('player-'+playerId);
    else if(isBall)drag.element=document.getElementById('ball-group');
  }

  function move(cx,cy){
    if(!drag)return;
    var p=point(cx,cy);drag.last=p;drag.moved=true;
    if(tool!=='move')return;

    var x=clamp(p.x,48,312),y;
    if(drag.playerId){
      var pl=playerById(drag.playerId);
      y=constrainedYForPlayer(pl,p.y);
      pl.x=x;pl.y=y;
      // direct DOM update: no full SVG redraw during dragging
      if(drag.element)drag.element.setAttribute('transform','translate('+x+' '+y+')');
    }else if(drag.isBall){
      y=constrainedYForBall(p.y);
      state.ball.x=x;state.ball.y=y;
      if(drag.element)drag.element.setAttribute('transform','translate('+x+' '+y+')');
    }
  }

  function end(){
    if(!drag)return;
    var d=drag;drag=null;
    if(!d.moved)return;

    if(tool==='move'){
      if(d.playerId||d.isBall){pushUndo(d.before);render()}
      return;
    }

    var dx=d.last.x-d.start.x,dy=d.last.y-d.start.y;
    if(Math.sqrt(dx*dx+dy*dy)>10){
      state.lines.push({x1:d.start.x,y1:d.start.y,x2:d.last.x,y2:d.last.y,type:tool,color:lineColorEl.value});
      pushUndo(d.before);render();
    }
  }

  // iPhone/iPad touch handling
  svg.addEventListener('touchstart',function(e){
    if(!e.touches||!e.touches.length)return;
    e.preventDefault();
    var t=e.touches[0];begin(t.clientX,t.clientY,e.target);
  },{passive:false});

  svg.addEventListener('touchmove',function(e){
    if(!drag||!e.touches||!e.touches.length)return;
    e.preventDefault();
    var t=e.touches[0];move(t.clientX,t.clientY);
  },{passive:false});

  svg.addEventListener('touchend',function(e){
    if(drag)e.preventDefault();
    end();
  },{passive:false});

  svg.addEventListener('touchcancel',function(){
    if(drag){state=drag.before;drag=null;render()}
  },{passive:false});

  // desktop mouse fallback
  svg.addEventListener('mousedown',function(e){e.preventDefault();begin(e.clientX,e.clientY,e.target)});
  window.addEventListener('mousemove',function(e){if(!drag)return;e.preventDefault();move(e.clientX,e.clientY)});
  window.addEventListener('mouseup',end);

  var toolButtons=document.querySelectorAll('[data-tool]');
  for(var i=0;i<toolButtons.length;i++){
    toolButtons[i].addEventListener('click',function(){
      tool=this.getAttribute('data-tool');
      for(var j=0;j<toolButtons.length;j++)toolButtons[j].classList.remove('active');
      this.classList.add('active');
      statusEl.textContent=tool==='move'?'Move mode — drag a player or ball across its half.':
        tool==='ball'?'Ball path — drag anywhere on court.':
        tool==='player'?'Player path — drag anywhere on court.':'Erase — tap a drawn line.';
    });
  }

  overlayEl.addEventListener('change',render);

  document.getElementById('clear').addEventListener('click',function(){
    if(!state.lines.length)return;var before=snap();state.lines=[];pushUndo(before);render()
  });
  document.getElementById('reset').addEventListener('click',function(){
    var before=snap();state=freshState();pushUndo(before);render()
  });
  document.getElementById('undo').addEventListener('click',function(){
    if(!undoStack.length)return;redoStack.push(snap());state=undoStack.pop();render()
  });
  document.getElementById('redo').addEventListener('click',function(){
    if(!redoStack.length)return;undoStack.push(snap());state=redoStack.pop();render()
  });
  document.getElementById('rotate').addEventListener('click',function(){
    var before=snap(),teams=['A','B'];
    for(var t=0;t<teams.length;t++){
      var list=[],pos=[];
      for(var i=0;i<state.players.length;i++)if(state.players[i].team===teams[t])list.push(state.players[i]);
      for(var j=0;j<list.length;j++)pos.push({x:list[j].x,y:list[j].y});
      for(var k=0;k<list.length;k++){var src=pos[(k+5)%6];list[k].x=src.x;list[k].y=src.y}
    }
    pushUndo(before);render()
  });
  document.getElementById('flip').addEventListener('click',function(){
    var before=snap();
    for(var i=0;i<state.players.length;i++){state.players[i].y=640-state.players[i].y;state.players[i].team=state.players[i].team==='A'?'B':'A'}
    state.ball.y=640-state.ball.y;state.ball.side=state.ball.side==='A'?'B':'A';
    for(var j=0;j<state.lines.length;j++){state.lines[j].y1=640-state.lines[j].y1;state.lines[j].y2=640-state.lines[j].y2}
    pushUndo(before);render()
  });

  state=freshState();render();
})();
</script>
</body>
</html>
